name: Validate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: read-all

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate packs (frontmatter, config integrity)
        run: node .github/scripts/validate-packs.cjs

      # The same content scan `bluetemberg add/install` runs on every download. Running it here
      # catches a blocking pattern (leaked credential, secret exfiltration, hidden Unicode text,
      # instructions to disable guardrails) before publish instead of at a consumer's install.
      # Warnings are printed for review and do not fail the job.
      - name: Content security scan
        run: npx bluetemberg scan packages/*

      - name: Lint markdown
        run: npm run lint:md

      - name: Audit dependencies
        run: npm audit --audit-level=high
