name: Stage New Packs

# Creates packs that don't exist on npm yet, so a new pack never needs a
# manual first publish from a maintainer's machine.
#
# Trusted Publishing (OIDC) can only publish over an existing package. Since
# 2026-10-02 `npm stage publish` can create a new package from CI with a
# stage-only token: the registry gets a public `0.0.0-stage` placeholder and
# the real first version waits in the staged queue until a maintainer
# approves it with 2FA. After that, the maintainer adds the trusted
# publisher and every later release goes through release-please.yml over
# OIDC. See docs/wiki/Releasing.md ("Adding a new pack").
#
# Secret: NPM_STAGE_TOKEN, a granular token with "Read and write (stage
# only)". It cannot publish directly, so a leak can only queue versions that
# still need a maintainer's 2FA approval.

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.detect.outputs.unpublished }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # A pack that was already staged has the `0.0.0-stage` placeholder, so
      # it no longer 404s and is not staged twice.
      - name: Detect packs missing from npm
        id: detect
        run: |
          pkgs=()
          for dir in packages/*/; do
            pkg="${dir%/}"
            pkg="${pkg#packages/}"
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$pkg")
            if [ "$code" = "404" ]; then
              echo "  missing: $pkg"
              pkgs+=("packages/$pkg")
            fi
          done
          list=$(printf '%s\n' "${pkgs[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "unpublished=$list" >> "$GITHUB_OUTPUT"
          echo "Missing from npm: $list"

  stage:
    needs: detect
    if: ${{ needs.detect.outputs.unpublished != '[]' && needs.detect.outputs.unpublished != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.detect.outputs.unpublished) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm >= 11.15.0.
      - name: Upgrade npm for staged publishing
        run: npm install -g npm@latest

      - name: Stage ${{ matrix.path }}
        env:
          PKG_PATH: ${{ matrix.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_STAGE_TOKEN is not set. See docs/wiki/Releasing.md (Stage-only token)."
            exit 1
          fi
          cd "$PKG_PATH"
          npm stage publish
          echo "::notice::Staged $(node -p 'require("./package.json").name'). Approve it with 2FA, then add the trusted publisher (docs/wiki/Releasing.md)."
